[package]
name = "tether-brain"
version = "0.1.0"
edition = "2021"
description = "The second brain: memories, notes and references for Tether, in one small SQLite-backed program"
license = "MIT"

[lib]
name = "tether_brain"
path = "src/lib.rs"

[[bin]]
name = "tether-brain"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
