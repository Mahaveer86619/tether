name: tether
description: "Tether: see and control every Claude Code session on your machines, from Android and Windows."
publish_to: 'none'
version: 0.17.0+1700

environment:
  sdk: ^3.13.5

dependencies:
  background_downloader: ^9.6.4
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  equatable: ^3.0.0
  file_picker: ^13.1.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  highlight: ^0.7.0
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  protobuf: ^6.1.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  async: ^2.13.0
  stream_channel: ^2.1.4
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#C2603E"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: false
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
