syntax = "proto3";

package tether.v1;

import "tether/v1/render.proto";

option go_package = "github.com/Mahaveer86619/tether/server/gen/tether/v1;tetherv1";

// Every WebSocket message is one Frame, encoded with protojson.
message Frame {
  uint32 v = 1;
  // Set by the sender of a command; echoed in reply_to on the Ack or Error.
  string id = 2;
  string reply_to = 3;
  // Per-session sequence number on timeline frames, assigned by the hub.
  uint64 seq = 4;

  oneof body {
    // Client -> hub
    ClientHello client_hello = 10;
    Subscribe subscribe = 11;
    Unsubscribe unsubscribe = 12;
    CreateSession create_session = 13;
    SendMessage send_message = 14;
    InterruptSession interrupt_session = 15;
    ApprovalDecision approval_decision = 16;
    StopSession stop_session = 17;
    // The app is in the foreground (or not); backups run while one is.
    ClientPresence client_presence = 18;

    // Hub -> client
    Welcome welcome = 30;
    Ack ack = 31;
    Error error = 32;
    NodeStatus node_status = 33;
    SessionInfo session_info = 34;
    TimelineUpdate timeline = 35;
    ApprovalRequest approval_requested = 36;
    ApprovalResolved approval_resolved = 37;
    SessionRemoved session_removed = 38;
    // The shared app settings changed (sent to every client).
    Preferences preferences = 39;
    // A file was added to the artifact store (sent to every client).
    Artifact artifact_added = 40;
    // A chat was created or changed (sent to every client).
    Chat chat = 41;
    // A newer release is available (sent to every client).
    UpdateManifest update_available = 42;

    // Agent -> hub
    AgentHello agent_hello = 50;
    SessionIndex session_index = 51;
    RawEvents raw_events = 52;
    // Token usage read from transcripts, per assistant message.
    UsageReport usage_report = 53;
    // The node's plan limits, from `claude -p /usage`.
    PlanUsage plan_usage = 54;
    // A session's terminal screen (agent -> hub, and hub -> subscribers).
    ScreenSnapshot screen_snapshot = 55;
    // How a SetMode went.
    ModeResult mode_result = 56;
    // A command the node couldn't carry out, e.g. an interrupt that didn't
    // land; the hub shows it on the session.
    CommandResult command_result = 57;
    // Transcript bytes for the hub's history (agent -> hub), and the end of
    // a sync run.
    HistoryChunk history_chunk = 58;
    HistorySynced history_synced = 59;
    // Also reuses approval_requested, approval_resolved (answered in the
    // terminal) and node_status (agent -> hub).

    // Hub -> agent
    AgentCommand agent_command = 60;
    // Also reuses approval_decision (hub -> agent).
  }
}

// ---- Shared types ----

message NodeStatus {
  string node = 1;
  bool online = 2;
  string os = 3;
  string hostname = 4;
  string claude_version = 5;
  string agent_version = 6;
  int64 last_seen_ms = 7;
  int32 running_sessions = 8;
  // The address the agent connects to the hub from, set by the hub.
  string ip = 9;
  // When the node's transcripts were last fully synced to the hub's history.
  int64 history_synced_ms = 10;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  // Nobody is writing to the session; it can be resumed.
  SESSION_STATE_IDLE = 1;
  // A Tether-run process is working on a turn.
  SESSION_STATE_RUNNING = 2;
  SESSION_STATE_AWAITING_APPROVAL = 3;
  // A Tether-run process is alive and waiting for the next message.
  SESSION_STATE_READY = 4;
  // Transcript written recently by a process Tether can't see (no hooks);
  // mirror only, or fork.
  SESSION_STATE_TERMINAL_ACTIVE = 5;
  SESSION_STATE_ERROR = 6;
}

// Where a session's live process runs.
enum SessionHost {
  SESSION_HOST_UNSPECIFIED = 0;
  // No live process.
  SESSION_HOST_NONE = 1;
  // `claude -p` run by the agent; no terminal to attach to.
  SESSION_HOST_HEADLESS = 2;
  // Interactive Claude Code in a tmux window owned by the agent; attachable.
  SESSION_HOST_TMUX = 3;
  // Interactive Claude Code started by you in some terminal; Tether sees it
  // through hooks but cannot type into it.
  SESSION_HOST_TERMINAL = 4;
}

message SessionInfo {
  string id = 1;
  string node = 2;
  string title = 3;
  string cwd = 4;
  string git_branch = 5;
  int64 created_ms = 6;
  int64 updated_ms = 7;
  int32 message_count = 8;
  SessionState state = 9;
  string last_prompt = 10;
  string claude_version = 11;
  string model = 12;
  // Filled by the hub from the timeline.
  repeated Todo todos = 13;
  double last_cost_usd = 14;
  string error = 15;
  SessionHost host = 16;
  // Command to open the live session in a terminal on its node, if any.
  string attach_command = 17;
  // A terminal session the agent can type into anyway (Windows consoles).
  bool terminal_input = 18;
  // Set by the user ("mark as done"); kept by the hub across agent updates
  // and cleared when the session starts working again.
  bool archived = 19;
  // Lineage, owned by the hub like archived: the session this one split off
  // from, the parent's last timeline item at that moment, and how ("fork",
  // later "branch").
  string parent = 20;
  string fork_point = 21;
  string lineage = 22;
  // Runs in its own scratch folder on the hub's machine (a hub session).
  bool scratch = 23;
  // The hub keeps a copy of its transcript, so it can be continued on the
  // hub's machine when its own machine is closed or offline.
  bool global = 24;
  // The codebase its folder belongs to, and the snapshot the hub took of it
  // for this session (set on forks); see docs/plan.md#codebases-on-the-hub.
  string codebase = 25;
  string snapshot = 26;
  // Claude Code's permission mode: default, acceptEdits, plan or auto. From
  // the transcript, or set from an app; empty when not known yet.
  string permission_mode = 27;
  // A mode set for a while: when the hub puts mode_revert_to back.
  int64 mode_revert_ms = 28;
  string mode_revert_to = 29;
  // The hub's latest backup of the transcript: when, and how big.
  int64 backed_up_ms = 30;
  int64 backed_up_bytes = 31;
}

// A session no longer exists on its node (its transcript was deleted).
message SessionRemoved {
  string session = 1;
}

message TimelineUpdate {
  string session = 1;
  repeated TimelineItem items = 2;
}

// Response of GET /api/v1/sessions/{id}/timeline.
message TimelinePage {
  string session = 1;
  // Ordered by ord.
  repeated TimelineItem items = 2;
  // The session's latest seq. Subscribe with it as after_seq to receive
  // only later changes; if it is lower than a cached seq, the hub was reset.
  uint64 seq = 3;
}

message ApprovalRequest {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_TOOL = 1;
    // Claude Code asks whether to trust a folder it hasn't opened before.
    KIND_FOLDER_TRUST = 2;
    // Claude asks the user questions (AskUserQuestion); input_json holds
    // them, and the decision carries the answers.
    KIND_QUESTION = 3;
    // A dialog read off Claude Code's screen (a survey, a menu, a picker)
    // that no hook reported; options holds its choices.
    KIND_PROMPT = 4;
  }
  string approval_id = 1;
  string session = 2;
  string node = 3;
  string tool_name = 4;
  string input_json = 5;
  string description = 6;
  int64 created_ms = 7;
  // The tool rendered as a card, for the approval sheet.
  ToolCard preview = 8;
  Kind kind = 9;
  // KIND_PROMPT: the dialog's choices in screen order, which one the cursor
  // is on (0-based), and the screen it was read from.
  repeated string options = 10;
  int32 selected = 11;
  string screen = 12;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  DECISION_DENY = 2;
}

message ApprovalDecision {
  string approval_id = 1;
  Decision decision = 2;
  // Shown to Claude when denying.
  string message = 3;
  // For a question: each question's text to the chosen option labels, joined
  // with ", ", or the user's own words.
  map<string, string> answers = 4;
  // For a prompt: the chosen option, 1-based. 0 with ALLOW takes the one the
  // cursor is on; DENY presses Esc.
  int32 option = 5;
}

message ApprovalResolved {
  string approval_id = 1;
  string session = 2;
  Decision decision = 3;
  string by = 4;
}

// ---- Client -> hub ----

message ClientPresence {
  bool active = 1;
}

message ClientHello {
  string token = 1;
  string client_name = 2;
  string platform = 3;
  // The app's version, for the devices screen's update check.
  string app_version = 4;
}

// An app connected to the hub right now. GET /api/v1/clients.
message ConnectedClient {
  string name = 1;
  string platform = 2;
  string app_version = 3;
  // Its paired device id; empty for the admin token or a trusted tailnet.
  string device_id = 4;
  string ip = 5;
  int64 connected_ms = 6;
}

message ClientList {
  repeated ConnectedClient clients = 1;
}

message Subscribe {
  string session = 1;
  // Replay items with seq greater than this; 0 replays everything.
  uint64 after_seq = 2;
}

message Unsubscribe {
  string session = 1;
}

message CreateSession {
  string node = 1;
  string cwd = 2;
  string prompt = 3;
  string model = 4;
  string permission_mode = 5;
  string name = 6;
  // Create cwd first: a new project folder in a workspace.
  bool create_cwd = 7;
  // Artifact ids to put in the session's folder and mention in the prompt.
  repeated string attachments = 8;
  // A hub session: run on the hub's machine in a fresh scratch folder.
  // node and cwd may be left empty.
  bool scratch = 9;
}

// REST body for POST /api/v1/sessions/{id}/archive.
message ArchiveSession {
  bool archived = 1;
}

// REST body for POST /api/v1/sessions/{id}/global.
message SetGlobal {
  bool global = 1;
}

message SendMessage {
  string session = 1;
  string text = 2;
  // Continue in a new session id, leaving the original untouched.
  bool fork = 3;
  // Artifact ids to put in the session's folder and mention in the message.
  repeated string attachments = 4;
  // Made by the client, once per message: the hub sends a repeat only once,
  // and stamps it on the user item the message becomes.
  string client_id = 5;
}

// Stops the current turn; the session stays open.
message InterruptSession {
  string session = 1;
}

// Ends a session the agent hosts (tmux or headless). Sessions open in your
// own terminal can only be interrupted, not ended.
message StopSession {
  string session = 1;
}

// ---- Hub -> client ----

message Welcome {
  string hub_version = 1;
  repeated NodeStatus nodes = 2;
  repeated SessionInfo sessions = 3;
  repeated ApprovalRequest pending_approvals = 4;
  // Unset until some client has saved them.
  Preferences preferences = 5;
  // The node running on the hub's own machine, where hub sessions run.
  string hub_node = 6;
  // About the client receiving this: its paired device id (empty for the
  // admin token or a trusted tailnet) and the address it connected from,
  // which matches NodeStatus.ip for the node on its own machine.
  string device_id = 7;
  string client_ip = 8;
  // Conversations, newest first; empty from a hub before 0.16.
  repeated Chat chats = 9;
  // The newest release the hub knows of; unset when it knows none.
  UpdateManifest update = 10;
}

message Ack {
  // Set when the command created a session (create, or send with fork).
  string session = 1;
}

message Error {
  string code = 1;
  string message = 2;
}

// ---- Agent <-> hub ----

message AgentHello {
  string token = 1;
  NodeStatus status = 2;
}

message SessionIndex {
  // True when sessions is the node's complete list; the hub forgets the
  // node's other sessions.
  bool full = 1;
  repeated SessionInfo sessions = 2;
  repeated string removed = 3;
}

message RawEvents {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    // Live output of a Tether-run `claude -p --output-format stream-json`.
    SOURCE_STREAM = 1;
    // Lines from ~/.claude/projects/<project>/<session>.jsonl.
    SOURCE_TRANSCRIPT = 2;
  }
  string session = 1;
  Source source = 2;
  repeated string lines = 3;
  // For transcripts: byte offset just past the last line.
  int64 end_offset = 4;
}

message AgentCommand {
  oneof op {
    StartRun start = 1;
    SendInput send = 2;
    Interrupt interrupt = 3;
    Mirror mirror = 4;
    StopMirror stop_mirror = 5;
    Stop stop = 6;
    // Delete a scratch session's folder and transcript (retention).
    Forget forget = 7;
    // Upload the session's whole transcript to the artifact store.
    UploadTranscript upload_transcript = 8;
    // Snapshot a codebase into the hub, and its .env files into the vault.
    SnapshotCodebase snapshot = 9;
    // Report the codebases directly under these workspace roots.
    ScanCodebases scan = 10;
    // Download a file attached to a session into its folder.
    FetchAttachment fetch = 11;
    // Press keys in the session's terminal: the way out of anything Tether
    // can't parse.
    SendKeys keys = 12;
    // Read the session's terminal screen; answered with a ScreenSnapshot.
    CaptureScreen capture = 13;
    // Switch a live session's permission mode; answered with a ModeResult.
    SetMode set_mode = 14;
    // Upload the transcripts that changed since the hub's copy.
    BackupSessions backup = 15;
    // Replace the agent's own binary with a newer release, then restart.
    SelfUpdate self_update = 16;
    // What the hub's history has of this node's transcripts; the agent sends
    // the rest.
    SyncHistory sync_history = 17;
    // The hub took a HistoryChunk up to offset; the next chunk starts there.
    HistoryAck history_ack = 18;
  }

  message StartRun {
    // Pre-assigned by the hub so clients can subscribe immediately.
    string session = 1;
    string cwd = 2;
    string prompt = 3;
    string model = 4;
    string permission_mode = 5;
    string name = 6;
    // Resume this existing session instead of starting fresh.
    string resume = 7;
    bool fork = 8;
    // Create cwd first (a new project folder).
    bool create_cwd = 9;
    repeated Artifact attachments = 10;
    // Run in <scratch dir>/<session>, created now.
    bool scratch = 11;
    // Put this transcript (an artifact) where Claude Code looks for the
    // resumed session first: continuing a global session elsewhere.
    string restore_transcript = 12;
    // Restore this codebase snapshot into <codebases dir>/<codebase> first,
    // with its .env files; cwd is then relative to that folder.
    string restore_codebase = 13;
    string restore_snapshot = 14;
    // Passed to Claude Code as --append-system-prompt. Agents before 0.16
    // ignore it, so the hub only sets it for newer ones.
    string system_prompt = 15;
  }

  message SendInput {
    string session = 1;
    string text = 2;
    // Fetched into the session's folder first; the text then lists them.
    repeated Artifact attachments = 3;
    // For a resume, when no process is live: the mode to start in.
    string permission_mode = 4;
    // For a resume: StartRun.system_prompt again, since Claude Code doesn't
    // keep it across --resume.
    string system_prompt = 5;
  }

  message SyncHistory {
    repeated HistoryPosition positions = 1;
  }

  message HistoryAck {
    string session = 1;
    string file = 2;
    int64 offset = 3;
  }

  message SelfUpdate {
    string version = 1;
    // url is a path on the hub.
    UpdateAsset asset = 2;
  }

  message SetMode {
    string session = 1;
    string mode = 2;
  }

  message Interrupt {
    string session = 1;
  }

  message Mirror {
    string session = 1;
    int64 from_offset = 2;
  }

  message StopMirror {
    string session = 1;
  }

  message Stop {
    string session = 1;
  }

  message Forget {
    string session = 1;
  }

  message UploadTranscript {
    string session = 1;
  }

  message SnapshotCodebase {
    Codebase codebase = 1;
    // The session it's taken for, if any.
    string session = 2;
  }

  message ScanCodebases {
    repeated string roots = 1;
  }

  message CaptureScreen {
    string session = 1;
  }

  message BackupSessions {
    // Session -> bytes of its transcript the hub has; unchanged ones are skipped.
    map<string, int64> stored = 1;
  }

  // Into <cwd>/.tether/attachments/<name>, checked against its sha256.
  message FetchAttachment {
    string session = 1;
    string cwd = 2;
    Artifact artifact = 3;
  }
}

// ---- Codebases (REST) ----

// A folder on a node the hub keeps copies of. GET /api/v1/codebases.
message Codebase {
  string id = 1;
  string node = 2;
  string path = 3;
  string name = 4;
  string git_remote = 5;
  string git_branch = 6;
  string git_head = 7;
  int64 created_ms = 8;
  // The latest snapshot.
  string snapshot = 9;
  int64 snapshot_ms = 10;
  int32 files = 11;
  int64 bytes = 12;
  // .env files kept in the vault, by path in the codebase; values never
  // leave the hub except to restore the codebase on the hub's machine.
  repeated EnvFile env = 13;
  // Why the last snapshot failed, if it did.
  string error = 14;
}

message CodebaseList {
  repeated Codebase codebases = 1;
}

message SnapshotFile {
  // Relative to the codebase, with forward slashes.
  string path = 1;
  string sha256 = 2;
  int64 size = 3;
  bool executable = 4;
}

// POST /api/v1/codebases/{id}/manifest answers with the hashes the hub
// lacks; the agent uploads those (PUT /api/v1/blobs/{sha}) and posts the
// same manifest to /snapshots to record it.
message SnapshotManifest {
  string session = 1;
  repeated SnapshotFile files = 2;
  // Too big to copy, or unreadable.
  repeated string skipped = 3;
  string git_remote = 4;
  string git_branch = 5;
  string git_head = 6;
}

message MissingBlobs {
  repeated string sha256 = 1;
}

message Snapshot {
  string id = 1;
  string codebase = 2;
  string session = 3;
  string parent = 4;
  int64 created_ms = 5;
  int32 files = 6;
  int64 bytes = 7;
  string git_head = 8;
  int32 skipped = 9;
  // The manifest, stored as a blob.
  string manifest_sha256 = 10;
}

message SnapshotList {
  repeated Snapshot snapshots = 1;
}

message EnvKey {
  string name = 1;
  // A short keyed hash of the value, so changes show without the value.
  string fingerprint = 2;
}

message EnvFile {
  // Relative to the codebase, e.g. "server/.env".
  string path = 1;
  repeated EnvKey keys = 2;
  int64 updated_ms = 3;
  // Only between agent and hub: the file as written, for the vault or to
  // restore it. Never in API responses to apps.
  string content = 4;
}

// PUT /api/v1/codebases/{id}/env (an agent storing), and what the hub's own
// agent gets back when restoring.
message EnvFiles {
  repeated EnvFile files = 1;
}

// Codebases an agent found under its workspace roots:
// POST /api/v1/codebases/found.
message FoundCodebases {
  string node = 1;
  repeated Codebase codebases = 2;
}

// ---- Pairing (REST only) ----

// An app or agent that paired with its own token. Revoking deletes it.
message Device {
  string id = 1;
  // "client" (an app or tetherctl) or "node" (an agent).
  string kind = 2;
  // For a node, the node name its token is bound to.
  string name = 3;
  string platform = 4;
  int64 created_ms = 5;
  int64 last_seen_ms = 6;
}

message DeviceList {
  repeated Device devices = 1;
}

// A one-time code another device can pair with until expires_ms.
message PairingCode {
  string code = 1;
  int64 expires_ms = 2;
  // SHA-256 of the hub's TLS certificate (hex), when it serves its own
  // self-signed one; clients pin it.
  string cert_fingerprint = 3;
}

message PairRequest {
  string code = 1;
  // "client" or "node".
  string kind = 2;
  string name = 3;
  string platform = 4;
}

message PairResult {
  Device device = 1;
  // Shown once; the hub keeps only its hash.
  string token = 2;
}

// ---- Shared app settings and the tailnet (REST, plus the preferences frame) ----

// App settings every connected app shares. PUT /api/v1/preferences.
message Preferences {
  // "system", "light" or "dark".
  string theme_mode = 1;
  // A palette id, e.g. "claude" or "ocean".
  string palette = 2;
  // ARGB accent; unset keeps the palette's own.
  optional uint32 accent = 3;
}

// A machine on the hub's tailnet, as `tailscale status` sees it, and what of
// Tether runs there. GET /api/v1/tailnet.
message TailnetDevice {
  // The tailnet machine name (first label of its MagicDNS name).
  string name = 1;
  string hostname = 2;
  string os = 3;
  bool online = 4;
  repeated string ips = 5;
  // The hub's own machine.
  bool self = 6;
  // The Tether node connected from this machine, if any.
  string node = 7;
  // Names of apps connected from this machine.
  repeated string clients = 8;
  int64 last_seen_ms = 9;
}

message Tailnet {
  repeated TailnetDevice devices = 1;
  // Set when `tailscale status` couldn't be read (no Tailscale on the hub).
  string error = 2;
}

// A fork, branch, merge or abandon, as the hub recorded it. GET
// /api/v1/sessions/{id}/lineage returns the events a session is part of.
message LineageEvent {
  int64 id = 1;
  string session = 2;
  string parent = 3;
  // "fork", "branch", "merge" or "abandon".
  string kind = 4;
  // The parent's timeline item it split at.
  string fork_point = 5;
  // The app or tool that asked, as for message sources.
  string by = 6;
  int64 at_ms = 7;
  // For a merge: the summary sent to the parent.
  string detail = 8;
}

message LineageEvents {
  repeated LineageEvent events = 1;
}

// ---- Usage (REST, plus the agent's usage_report frame) ----

// One assistant message's token usage. A message is written over several
// transcript lines, so the hub keeps the largest value it has seen per field.
message UsageEntry {
  string session = 1;
  string message_id = 2;
  string model = 3;
  int64 ts_ms = 4;
  int64 input = 5;
  int64 output = 6;
  int64 cache_write = 7;
  int64 cache_read = 8;
}

message UsageReport {
  repeated UsageEntry entries = 1;
}

message UsageTotals {
  int64 input = 1;
  int64 output = 2;
  int64 cache_write = 3;
  int64 cache_read = 4;
  int64 messages = 5;
}

message NodeUsage {
  string node = 1;
  // The last 5 hours (Claude's usage window), since local midnight, and the
  // last 7 days.
  UsageTotals window = 2;
  UsageTotals today = 3;
  UsageTotals week = 4;
  reserved 5; // was window_budget, replaced by the plan's own limits
  // The plan's limits as this node's Claude login reports them.
  PlanUsage plan = 6;
}

// A plan limit from `/usage`, e.g. "session" 3% resetting "Oct 12, 3:19am".
message PlanLimit {
  string label = 1;
  int32 percent = 2;
  string resets = 3;
}

// What `claude -p /usage` says on a node. The text isn't a stable interface,
// so the raw output is kept for when the limits can't be read from it.
message PlanUsage {
  string node = 1;
  repeated PlanLimit limits = 2;
  string raw = 3;
  int64 checked_ms = 4;
  string error = 5;
}

message SessionUsage {
  string session = 1;
  UsageTotals total = 2;
  int64 last_ms = 3;
}

// GET /api/v1/usage
message UsageSummary {
  repeated NodeUsage nodes = 1;
  // Sessions used in the last 7 days, most tokens first.
  repeated SessionUsage sessions = 2;
}

// ---- Workspaces (REST) ----

// A folder on a node that new projects are made in, e.g. ~/projects.
message WorkspaceRoot {
  string node = 1;
  string path = 2;
}

// GET /api/v1/workspaces; PUT adds a root, DELETE (same body) removes it.
message Workspaces {
  repeated WorkspaceRoot roots = 1;
}

// ---- Artifact store (REST, plus the artifact_added frame) ----

// A file in the hub's central store: something a session read or wrote,
// or that someone attached. Content is stored once per SHA-256.
message Artifact {
  string id = 1;
  string sha256 = 2;
  string name = 3;
  string mime = 4;
  int64 size = 5;
  string session = 6;
  string node = 7;
  // "read" or "write" (by a tool), "attachment" (sent with a message) or
  // "upload".
  string origin = 8;
  // Where it was on the node, if it came from a tool call.
  string path = 9;
  // The tool call it belongs to, so the app can show it on that card.
  string tool_use_id = 10;
  int64 created_ms = 11;
  // Written by whoever attached it.
  string note = 12;
}

// POST /api/v1/sessions/{id}/keys. keys are pressed in order: Enter,
// Escape, Up, Down, Left, Right, Tab, BTab (Shift+Tab), Space, Backspace,
// or a single character; text, if set, is typed after them.
message SendKeys {
  string session = 1;
  repeated string keys = 2;
  string text = 3;
}

// POST /api/v1/sessions/{id}/mode. With revert_after_ms the hub puts the
// current mode back after that long.
message SetPermissionMode {
  string session = 1;
  string mode = 2;
  int64 revert_after_ms = 3;
}

message CommandResult {
  string session = 1;
  // "interrupt".
  string command = 2;
  string error = 3;
}

message ModeResult {
  string session = 1;
  string mode = 2;
  string error = 3;
}

// GET /api/v1/sessions/{id}/screen.
message ScreenSnapshot {
  string session = 1;
  string text = 2;
  int64 captured_ms = 3;
  // Why there's no screen: a headless run has no terminal, say.
  string error = 4;
}

message ArtifactList {
  repeated Artifact artifacts = 1;
}

// A resumable upload: POST /api/v1/uploads starts one, PATCH appends at
// offset, and the last chunk turns it into the artifact.
message Upload {
  string id = 1;
  int64 offset = 2;
  int64 size = 3;
  Artifact artifact = 4;
}

// A link that opens the file without a token until expires_ms. url is a
// path; clients put their hub address in front.
message ArtifactLink {
  string url = 1;
  int64 expires_ms = 2;
}

// A small site a session made under .tether/pages/<name>/. Its files are
// artifacts with origin "page" and path "<name>/<file>".
message Page {
  string session = 1;
  string name = 2;
  int32 files = 3;
  int64 size = 4;
  int64 updated_ms = 5;
  // A signed link to its index.html, as a path on the hub.
  string url = 6;
  int64 expires_ms = 7;
}

// GET /api/v1/pages?session=
message PageList {
  repeated Page pages = 1;
}

// ---- Chats ----
//
// A chat is the conversation the user sees; the sessions doing the work sit
// behind it. One is active (messages go there); others are linked: forks,
// sessions it started on other machines, or a move to another folder.
// See docs/chats.md.

message Chat {
  string id = 1;
  string title = 2;
  // The user named it; title jobs leave it alone.
  bool title_by_user = 3;
  int64 created_ms = 4;
  int64 updated_ms = 5;
  bool archived = 6;
  ChatTarget target = 7;
  // Where messages go now.
  string active_session = 8;
  // Oldest first, the active one included.
  repeated ChatLink sessions = 9;
}

// Where a chat's work runs.
message ChatTarget {
  // "auto": the hub picked it from the prompt and recent work; "manual":
  // the user picked it; "claude": Claude works it out in a scratch folder.
  string mode = 1;
  string node = 2;
  // Empty with node set: the node's home folder.
  string cwd = 3;
  // "resolved", or "detecting" while Claude is still working it out.
  string state = 4;
  // Why it was picked, for the UI: "matched “tether”", "picked by you"...
  string reason = 5;
  // A fresh scratch folder on the hub's machine.
  bool scratch = 6;
}

message ChatLink {
  string session = 1;
  // "main", "moved" (continued in another folder), "fork", "started" (by
  // Claude, through the hub), "linked" (added by hand).
  string role = 2;
  int64 linked_ms = 3;
}

// POST /api/v1/chats. Starts the chat's first session, or adopts an
// existing one when session is set.
message CreateChat {
  string prompt = 1;
  // Unset or mode "auto": the hub picks; it falls back to "claude".
  ChatTarget target = 2;
  repeated string attachments = 3;
  string model = 4;
  string permission_mode = 5;
  string title = 6;
  string session = 7;
  // Made by the client; stamped on the first message like SendMessage's.
  string client_id = 8;
}

// PATCH /api/v1/chats/{id}. Unset fields stay as they are.
message UpdateChat {
  optional string title = 1;
  optional bool archived = 2;
}

// POST /api/v1/chats/{id}/target: change where the chat works. With move,
// a new session starts there carrying the conversation so far and becomes
// the active one; without it only the target is recorded.
message SetChatTarget {
  ChatTarget target = 1;
  bool move = 2;
  // The first message for the moved session; defaults to carrying on.
  string text = 3;
}

// POST /api/v1/chats/{id}/links
message LinkSession {
  string session = 1;
  string role = 2;
  bool unlink = 3;
}

message ChatList {
  repeated Chat chats = 1;
}

// One message of a chat's stored context.
message ChatMessage {
  string session = 1;
  string item_id = 2;
  // "user" or "assistant".
  string role = 3;
  string text = 4;
  int64 ts_ms = 5;
}

// Output of a post-processing job, by kind ("title", "summary"...).
message ChatNote {
  string kind = 1;
  string value = 2;
  int64 updated_ms = 3;
}

// GET /api/v1/chats/{id}/context: everything said in the chat, across its
// sessions, kept even after a session is gone.
message ChatContext {
  Chat chat = 1;
  repeated ChatMessage messages = 2;
  repeated ChatNote notes = 3;
}

// A place a chat could run, best first.
message TargetCandidate {
  string node = 1;
  string cwd = 2;
  string label = 3;
  bool online = 4;
  // Higher is better; 0 means no clue from the prompt.
  double score = 5;
  string reason = 6;
  int64 last_used_ms = 7;
}

// GET /api/v1/targets?prompt=
message TargetSuggestions {
  repeated TargetCandidate candidates = 1;
  // What auto would pick now; unset when it would hand over to Claude.
  TargetCandidate pick = 2;
}

// ---- Updates ----
//
// A release's latest.json, as CI publishes it and the hub serves it at
// GET /api/v1/updates/latest. See docs/releasing.md.

message UpdateAsset {
  string name = 1;
  // From the hub: a path on it (/api/v1/updates/files/...). In latest.json
  // as published: the GitHub release download URL.
  string url = 2;
  string sha256 = 3;
  int64 size = 4;
}

message UpdateManifest {
  string version = 1;
  // Markdown.
  string notes = 2;
  // RFC 3339.
  string published = 3;
  // Apps and agents older than this must update before they carry on.
  string min_supported = 4;
  // By platform: android, windows (the app as a zip), agent-linux-amd64,
  // agent-windows-amd64, hub-linux-amd64, tetherctl-linux-amd64,
  // tetherctl-windows-amd64.
  map<string, UpdateAsset> platforms = 5;
}

// ---- History ----
//
// The hub keeps every session's transcript: agents send it in chunks, the
// hub stores the lines and indexes them as events. See docs/history.md.

// How far the hub has one transcript file. file is "" for the session's
// own transcript, or "subagents/<name>.jsonl".
message HistoryPosition {
  string session = 1;
  string file = 2;
  int64 offset = 3;
  // sha256 (hex) of the file's first head_len bytes, as the hub got them:
  // a file that no longer starts the same was rewritten and is sent again.
  string head = 4;
  int64 head_len = 5;
}

// Whole lines of a transcript file from offset; reset starts the file over.
message HistoryChunk {
  string session = 1;
  string file = 2;
  int64 offset = 3;
  bytes data = 4;
  bool reset = 5;
  // The file's size when read.
  int64 size = 6;
  // Bytes after data that the agent didn't send: a line too large for a
  // message. The hub moves its position past them.
  int64 skip = 7;
}

message HistorySynced {
  int64 at_ms = 1;
}

// One transcript line, as history: what was said or done, and where.
message HistoryEvent {
  // Grows with every event stored: the changes feed's cursor.
  uint64 seq = 1;
  string session = 2;
  string node = 3;
  string file = 4;
  // Byte offset of the line in its transcript file.
  int64 offset = 5;
  // The line's uuid, when it has one.
  string event_id = 6;
  int64 ts_ms = 7;
  // user, assistant, tool_use, tool_result, summary, system, state.
  string kind = 8;
  // Plain text (secrets redacted when the hub is set to).
  string text = 9;
  string tool = 10;
  string model = 11;
  string cwd = 12;
  bool redacted = 13;
}

// A page of history, oldest first. Pass before to get older events,
// after to get newer ones.
message HistoryPage {
  repeated HistoryEvent events = 1;
  string before = 2;
  string after = 3;
  bool more_before = 4;
  bool more_after = 5;
}

message HistoryHit {
  HistoryEvent event = 1;
  // The matching words in [brackets].
  string snippet = 2;
  // The chat the session is in, if any.
  string chat = 3;
}

message HistorySearch {
  repeated HistoryHit hits = 1;
}

// GET /api/v1/history/changes?since=: events stored after the cursor.
message HistoryChanges {
  repeated HistoryEvent events = 1;
  uint64 cursor = 2;
  bool more = 3;
  // Files started over since the cursor: drop what you have of them.
  repeated HistoryPosition resets = 4;
}

message HistoryNodeStatus {
  string node = 1;
  int64 synced_ms = 2;
  int64 files = 3;
  int64 bytes = 4;
  int64 events = 5;
}

message HistoryStatus {
  repeated HistoryNodeStatus nodes = 1;
  int64 events = 2;
  int64 bytes = 3;
}
