# Builds and publishes the app track when an app-vX.Y.Z tag is pushed.
#   linux    (the hub's machine) builds the signed APK
#   windows  (GitHub)            builds the Windows app and signed appcast
#   publish                      makes the GitHub Release with app-latest.json
# No hub deploy is needed. See docs/operations/releasing.md.
name: release-app

on:
  push:
    tags: ['app-v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  linux:
    runs-on: [self-hosted, linux, tether]
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version
        run: |
          tag=""
          [ "$GITHUB_REF_TYPE" = tag ] && tag="$GITHUB_REF_NAME"
          echo "version=$(tools/release/version.sh check "$tag")" >> "$GITHUB_OUTPUT"
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_* secrets aren't set; see docs/operations/releasing.md#signing"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF
      - name: Build
        run: tools/release/build.sh app --no-manifest
      - name: Forget the signing key
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-app-linux
          path: dist/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Build the app, its zip and the installer
        shell: pwsh
        run: ./tools/release/build-windows.ps1
      - name: Sign the installer and write the appcast
        shell: bash
        env:
          APPCAST_DSA_PRIVATE_KEY: ${{ secrets.APPCAST_DSA_PRIVATE_KEY }}
        run: |
          if [ -z "$APPCAST_DSA_PRIVATE_KEY" ]; then
            echo "::error::The APPCAST_DSA_PRIVATE_KEY secret isn't set; see docs/operations/releasing.md#windows-updates"
            exit 1
          fi
          umask 077
          printf '%s\n' "$APPCAST_DSA_PRIVATE_KEY" > "$RUNNER_TEMP/dsa_priv.pem"
          V=$(tools/release/version.sh check)
          APPCAST_KEY="$RUNNER_TEMP/dsa_priv.pem" tools/release/appcast.sh "dist/$V"
          rm -f "$RUNNER_TEMP/dsa_priv.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-app-windows
          path: |
            dist/*/tether-windows-*.zip
            dist/*/Tether-Setup-*.exe
            dist/*/appcast.xml
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [linux, windows]
    # A broken Windows build still publishes the APK; Windows users stay on
    # the release before until it is fixed.
    if: always() && needs.linux.result == 'success' && github.ref_type == 'tag'
    runs-on: [self-hosted, linux, tether]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-app-linux
          path: dist/${{ needs.linux.outputs.version }}
      - uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: dist-app-windows
          # The artifact keeps its dist/<version>/ folders, so it unpacks over dist itself.
          path: dist
      - name: app-latest.json and SHA256SUMS
        run: tools/release/manifest.sh app "dist/${{ needs.linux.outputs.version }}"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.linux.outputs.version }}
        run: |
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["notes"])' "dist/$V/app-latest.json" > "$RUNNER_TEMP/notes.md"
          gh release create "app-v$V" --title "Tether app $V" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag dist/$V/*
