# Tests every push and pull request on GitHub's runners. The self-hosted
# runner on the hub's machine only runs release.yml, never code from a
# pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Vet and test
        working-directory: server
        run: |
          go vet ./...
          go test ./...

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Versions agree
        run: tools/release/version.sh check
      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test --exclude-tags live
