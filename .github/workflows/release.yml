# Builds, publishes and deploys a release when a vX.Y.Z tag is pushed.
#   linux    (the hub's machine) tests, builds the Go binaries and the signed APK
#   windows  (GitHub)            builds the Windows app
#   publish                      makes the GitHub Release with latest.json
#   deploy   (the hub's machine) installs the release there, with rollback;
#                                it needs only the linux job, never Windows
# See docs/releasing.md.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the hub's machine
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    runs-on: [self-hosted, linux, tether]
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version
        run: |
          tag=""
          [ "$GITHUB_REF_TYPE" = tag ] && tag="$GITHUB_REF_NAME"
          echo "version=$(tools/release/version.sh check $tag)" >> "$GITHUB_OUTPUT"
      - name: Test
        run: make test
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_* secrets aren't set; see docs/releasing.md#signing"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF
      - name: Build
        run: tools/release/build.sh --no-manifest
      - name: Forget the signing key
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Build
        shell: pwsh
        run: ./tools/release/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*/tether-windows-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [linux, windows]
    # A broken Windows build still publishes the rest; the app's Windows
    # users then stay on the release before.
    if: always() && needs.linux.result == 'success' && github.ref_type == 'tag'
    runs-on: [self-hosted, linux, tether]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist/${{ needs.linux.outputs.version }}
      - uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: dist-windows
          path: dist/${{ needs.linux.outputs.version }}
      - name: latest.json and SHA256SUMS
        run: tools/release/manifest.sh "dist/${{ needs.linux.outputs.version }}"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.linux.outputs.version }}
        run: |
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["notes"])' "dist/$V/latest.json" > "$RUNNER_TEMP/notes.md"
          gh release create "v$V" --title "Tether $V" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag dist/$V/*

  deploy:
    needs: [linux]
    if: github.ref_type == 'tag' || inputs.deploy
    runs-on: [self-hosted, linux, tether]
    environment: minipc
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist/${{ needs.linux.outputs.version }}
      - name: latest.json
        run: tools/release/manifest.sh "dist/${{ needs.linux.outputs.version }}"
      - name: Deploy with backup and rollback
        run: deploy/linux/deploy.sh "dist/${{ needs.linux.outputs.version }}"
